<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>撲克牌記憶配對遊戲</title>
    <style>
        :root {
            /* 舒適的淡黃色繪本風格配色 */
            --bg-color: #fcf8ee;       /* 溫暖淡黃色背景 */
            --panel-bg: #ffffff;       /* 白色純淨看板 */
            --accent-color: #e2a04e;    /* 向日葵暖黃 */
            --card-back: #d1c4e9;      /* 溫柔的淡紫色卡背 (Lavender) */
            --card-front: #ffffff;     /* 卡片正面白色 */
            --border-normal: #f0cb85;  /* 卡片未配對時的淡黃邊框 */
            --text-dark: #4a3e3d;      /* 繪本風深色文字 */
        }

        body {
            margin: 0;
            padding: 15px;
            background-color: var(--bg-color);
            /* 微妙的暖黃色圓點裝飾 */
            background-image: radial-gradient(rgba(226, 160, 78, 0.12) 15%, transparent 16%);
            background-size: 24px 24px;
            font-family: 'Helvetica Neue', Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 內容區塊主容器 */
        .game-container {
            max-width: 1000px; /* 【升級】加寬容器以容納 8 欄卡片 */
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        h1 {
            margin-bottom: 5px;
            color: var(--accent-color);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
            align-self: center; /* 標題維持中央置中 */
            font-size: 2rem;
        }

        /* 儀表板資訊：看板靠右 */
        .info-panel {
            display: flex;
            gap: 20px;
            font-size: 1.1rem;
            margin-bottom: 15px;
            background: var(--panel-bg);
            padding: 8px 20px;
            border-radius: 50px;
            border: 2px solid #f0cb85;
            box-shadow: 0 4px 12px rgba(226, 160, 78, 0.1);
            align-self: flex-end; 
        }

        .info-panel div {
            font-weight: 500;
        }

        /* 遊戲主舞台：【核心修改】改為 8 欄網格，容納 32 張牌 */
        .game-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 10px;
            width: 100%;
            margin-bottom: 20px;
        }

        /* 卡牌基礎樣式 */
        .card {
            aspect-ratio: 2 / 3;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }

        /* 翻牌動態效能 */
        .card.flipped, .card.matched {
            transform: rotateY(180deg);
        }

        /* 配對成功後：保持正面花色朝上，鎖定點擊 */
        .card.matched {
            cursor: default;
            pointer-events: none;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6rem;
            font-weight: bold;
            box-shadow: 0 3px 6px rgba(74, 62, 61, 0.12);
        }

        /* 卡背：淡紫色幾何線條紋路 */
        .card-back {
            background-color: var(--card-back);
            border: 4px solid white;
            box-sizing: border-box;
            background-image: radial-gradient(rgba(255,255,255,0.5) 15%, transparent 16%),
                              radial-gradient(rgba(255,255,255,0.5) 15%, transparent 16%);
            background-size: 14px 14px;
            background-position: 0 0, 7px 7px;
        }
        .card:hover .card-back {
            border-color: #fff;
            box-shadow: 0 4px 12px rgba(179, 157, 219, 0.5);
        }

        /* 卡面 */
        .card-front {
            background-color: var(--card-front);
            transform: rotateY(180deg);
            flex-direction: column;
            justify-content: space-between;
            padding: 6px;
            box-sizing: border-box;
            border: 1px solid #f0cb85;
        }

        /* 花色顏色調整 */
        .card-front.red { color: #e74c3c; }
        .card-front.black { color: #2c3e50; }

        .card-corner {
            align-self: flex-start;
            font-size: 0.9rem;
            line-height: 1;
        }
        .card-center {
            font-size: 2.2rem;
            line-height: 1;
        }
        .card-corner.bottom {
            align-self: flex-end;
            transform: rotate(180deg);
        }

        /* 按鈕樣式：靠左排列 */
        .btn {
            padding: 12px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            background: linear-gradient(45deg, #f7d08a, var(--accent-color));
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(226, 160, 78, 0.2);
            transition: all 0.2s ease;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            align-self: flex-start; 
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(226, 160, 78, 0.3);
        }

        /* RWD 行動裝置調整：寬度不夠時自動縮為 4 欄以利手機單手點擊 */
        @media (max-width: 768px) {
            .game-board { 
                grid-template-columns: repeat(4, 1fr); 
                gap: 8px;
            }
            .card-face { font-size: 1.3rem; }
            .card-center { font-size: 1.8rem; }
            .card-corner { font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>撲克牌記憶配對</h1>
        
        <div class="info-panel">
            <div>時間: <span id="timer">0</span> 秒</div>
            <div>翻牌次數: <span id="moves">0</span></div>
        </div>

        <div class="game-board" id="board"></div>

        <button class="btn" onclick="resetGame()">重新開始</button>
    </div>

    <script>
        // 【升級】定義擴充至 16 組不同的撲克牌型（共 32 張）
        const cardData = [
            { suit: '♠', value: 'A', color: 'black' },
            { suit: '♥', value: 'K', color: 'red' },
            { suit: '♦', value: 'Q', color: 'red' },
            { suit: '♣', value: 'J', color: 'black' },
            { suit: '♠', value: '10', color: 'black' },
            { suit: '♥', value: '9', color: 'red' },
            { suit: '♦', value: '8', color: 'red' },
            { suit: '♣', value: '7', color: 'black' },
            /* 新增 8 組 */
            { suit: '♠', value: '2', color: 'black' },
            { suit: '♥', value: '3', color: 'red' },
            { suit: '♦', value: '4', color: 'red' },
            { suit: '♣', value: '5', color: 'black' },
            { suit: '♠', value: '6', color: 'black' },
            { suit: '♥', value: '7', color: 'red' },
            { suit: '♦', value: 'J', color: 'red' },
            { suit: '♣', value: 'Q', color: 'black' }
        ];

        // 複製成雙份（共 32 張）
        let cards = [...cardData, ...cardData];
        
        let flippedCards = [];
        let matchedCount = 0;
        let moves = 0;
        let timer = null;
        let seconds = 0;
        let gameStarted = false;

        const board = document.getElementById('board');
        const timerEl = document.getElementById('timer');
        const movesEl = document.getElementById('moves');

        // 洗牌演算法 (Fisher-Yates)
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 初始化遊戲板
        function initGame() {
            board.innerHTML = '';
            flippedCards = [];
            matchedCount = 0;
            moves = 0;
            seconds = 0;
            gameStarted = false;
            clearInterval(timer);
            timerEl.textContent = seconds;
            movesEl.textContent = moves;

            const shuffledCards = shuffle([...cards]);

            shuffledCards.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.classList.add('card');
                cardEl.dataset.index = index;
                cardEl.dataset.suit = card.suit;
                cardEl.dataset.value = card.value;

                cardEl.innerHTML = `
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front ${card.color}">
                        <div class="card-corner">${card.value}<br>${card.suit}</div>
                        <div class="card-center">${card.suit}</div>
                        <div class="card-corner bottom">${card.value}<br>${card.suit}</div>
                    </div>
                `;

                cardEl.addEventListener('click', flipCard);
                board.appendChild(cardEl);
            });
        }

        // 計時器功能
        function startTimer() {
            gameStarted = true;
            timer = setInterval(() => {
                seconds++;
                timerEl.textContent = seconds;
            }, 1000);
        }

        // 翻牌邏輯
        function flipCard() {
            if (!gameStarted) startTimer();
            
            if (this.classList.contains('flipped') || this.classList.contains('matched') || flippedCards.length >= 2) {
                return;
            }

            this.classList.add('flipped');
            flippedCards.push(this);

            if (flippedCards.length === 2) {
                moves++;
                movesEl.textContent = moves;
                checkMatch();
            }
        }

        // 檢查是否配對成功
        function checkMatch() {
            const [card1, card2] = flippedCards;
            const isMatch = card1.dataset.suit === card2.dataset.suit && card1.dataset.value === card2.dataset.value;

            if (isMatch) {
                card1.classList.remove('flipped');
