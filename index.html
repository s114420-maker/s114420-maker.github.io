<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google 快捷搜尋站</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 100px auto;
            padding: 20px;
            background-color: #f9f9f9;
            text-align: center;
        }
        h1 {
            color: #202124;
            font-size: 32px;
            margin-bottom: 30px;
        }
        .search-box {
            display: flex;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            overflow: hidden;
            background: white;
        }
        .search-box:hover {
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        #searchInput {
            flex: 1;
            padding: 15px 20px;
            font-size: 16px;
            border: none;
            outline: none;
        }
        #searchBtn {
            padding: 0 25px;
            font-size: 16px;
            background-color: #f8f9fa;
            color: #3c4043;
            border: none;
            cursor: pointer;
            border-left: 1px solid #dfe1e5;
            transition: background 0.2s;
        }
        #searchBtn:hover {
            background-color: #f1f3f4;
        }
    </style>
</head>
<body>

    <h1>Google 資料搜尋站</h1>
    
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="請輸入關鍵字，將為您導向 Google 搜尋...">
        <button id="searchBtn">Google 搜尋</button>
    </div>

    <script>
        function redirectToGoogle() {
            const query = document.getElementById('searchInput').value.trim();
            if (query !== '') {
                // 自動將關鍵字帶入 Google 搜尋網址，並在新分頁打開
                const googleUrl = `https://google.com{encodeURIComponent(query)}`;
                window.open(googleUrl, '_blank');
            } else {
                alert('請先輸入關鍵字！');
            }
        }

        // 綁定按鈕點擊與 Enter 鍵
        document.getElementById('searchBtn').addEventListener('click', redirectToGoogle);
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                redirectToGoogle();
            }
        });
    </script>
</body>
</html>
