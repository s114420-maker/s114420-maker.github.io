<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全網資料搜尋站</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: #ffffff;
        }
        h1 {
            color: #1a73e8;
            margin-bottom: 20px;
        }
        /* 確保輸入框又大又好點擊，絕對不會有點不到無法打字的問題 */
        #searchInput {
            width: 100%;
            max-width: 500px;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ccc;
            border-radius: 4px;
            margin-bottom: 15px;
            display: block;
            box-sizing: border-box;
        }
        #searchInput:focus {
            border-color: #1a73e8;
        }
        #searchBtn {
            padding: 12px 30px;
            font-size: 18px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            display: block;
        }
        #searchBtn:hover {
            background-color: #1557b0;
        }
        .tip {
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>萬能資料搜尋站</h1>
    
    <!-- 這是標準輸入框，用滑鼠點一下或用手機按一下就能直接打字 -->
    <input type="text" id="searchInput" placeholder="請點擊此處輸入關鍵字..." autofocus>
    
    <button id="searchBtn">搜尋資料</button>

    <div class="tip">💡 提示：輸入想找的內容後，點擊「搜尋資料」按鈕即可。</div>

    <script>
        function goSearch() {
            var inputWord = document.getElementById('searchInput').value.trim();
            if (inputWord !== '') {
                // 直接導向並跑出 Google 的相關資料連結
                var target = 'https://google.com' + encodeURIComponent(inputWord);
                window.open(target, '_blank');
            } else {
                alert('請先輸入關鍵字！');
            }
        }

        // 綁定按鈕點擊事件
        document.getElementById('searchBtn').addEventListener('click', goSearch);
        
        // 綁定鍵盤 Enter 事件
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                goSearch();
            }
        });
    </script>

</body>
</html>
