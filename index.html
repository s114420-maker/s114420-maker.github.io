<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1028 時尚美妝接接樂</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffe3e8;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            color: #d15b72;
            margin: 10px 0;
        }

        .upload-panel {
            background: white;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .upload-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
        }

        #game-container {
            position: relative;
            width: 360px;
            height: 460px;
            background: #fff0f2;
            border: 4px solid #d15b72;
            border-radius: 15px;
            overflow: hidden;
            touch-action: none; /* 防止手機瀏覽器震動或上下捲動 */
        }

        .ui-layer {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            color: #d15b72;
            pointer-events: none;
            z-index: 5;
        }

        #player {
            position: absolute;
            bottom: 20px;
            left: 140px;
            width: 80px;
            height: 40px;
            background-color: #e87a90;
            background-size: cover;
            background-position: center;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .falling-item {
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: #f3a6b6;
            background-size: cover;
            background-position: center;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 11px;
            font-weight: bold;
        }

        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(209, 91, 114, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 8;
            display: none;
        }

        #restart-btn {
            padding: 10px 20px;
            background: white;
            color: #d15b72;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>1028 接接樂</h1>

    <div class="upload-panel">
        <div class="upload-group">
            <label><b>換玩家圖</b></label>
            <input type="file" id="player-img-input" accept="image/*">
        </div>
        <div class="upload-group">
            <label><b>換掉落物圖</b></label>
            <input type="file" id="item-img-input" accept="image/*">
        </div>
    </div>

    <div id="game-container">
        <div class="ui-layer">
            <div id="score-board">得分: 0</div>
            <div id="lives-board">生命值: ❤️❤️❤️</div>
        </div>
        <div id="player">1028</div>
        <div id="game-over-screen">
            <h2>遊戲結束</h2>
            <p id="final-score">最終得分: 0</p>
            <button id="restart-btn" onclick="resetGame()">重新開始</button>
        </div>
    </div>

    <script>
        const container = document.getElementById('game-container');
        const player = document.getElementById('player');
        const scoreBoard = document.getElementById('score-board');
        const livesBoard = document.getElementById('lives-board');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreText = document.getElementById('final-score');
        const playerImgInput = document.getElementById('player-img-input');
        const itemImgInput = document.getElementById('item-img-input');

        let customPlayerImg = "";
        let customItemImg = "";
        const containerWidth = 360;
        const playerWidth = 80;
        let playerX = 140;
        let score = 0;
        let lives = 3;
        let isGameOver = false;
        let fallingItems = [];
        let gameLoopId;
        let spawnTimerId;
        let fallSpeed = 3;

        // 圖片變更監聽
        playerImgInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    customPlayerImg = event.target.result;
                    player.style.backgroundImage = `url('${customPlayerImg}')`;
                    player.textContent = "";
                };
                reader.readAsDataURL(file);
            }
        });

        itemImgInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => { customItemImg = event.target.result; };
                reader.readAsDataURL(file);
            }
        });

        // 玩家位置更新
        function setPlayerX(x) {
            let targetX = x - (playerWidth / 2);
            if (targetX < 0) targetX = 0;
            if (targetX > containerWidth - playerWidth) targetX = containerWidth - playerWidth;
            playerX = targetX;
            player.style.left = playerX + 'px';
        }

        // 鍵盤控制 (左右方向鍵 或 A、D 鍵)
        document.addEventListener('keydown', (e) => {
            if (isGameOver) return;
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                setPlayerX(playerX + (playerWidth/2) - 25);
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                setPlayerX(playerX + (playerWidth/2) + 25);
            }
        });

        // 點擊與觸控控制 (直接抓取位置，防止拖曳卡死)
        function handleInteraction(e) {
            if (isGameOver) return;
            const rect = container.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const relativeX = clientX - rect.left;
            setPlayerX(relativeX);
        }

        container.addEventListener('mousedown', handleInteraction);
        container.addEventListener('mousemove', (e) => { if(e.buttons === 1) handleInteraction(e); });
        container.addEventListener('touchstart', handleInteraction, {passive: true});
        container.addEventListener('touchmove', handleInteraction, {passive: true});

        // 生成掉落物
        function spawnItem() {
            if (isGameOver) return;
            const item = document.createElement('div');
            item.classList.add('falling-item');
            const itemX = Math.floor(Math.random() * (containerWidth - 40));
            item.style.left = itemX + 'px';
            item.style.top = '0px';

            if (customItemImg) {
                item.style.backgroundImage = `url('${customItemImg}')`;
                item.style.backgroundColor = "transparent";
            } else {
                item.textContent = "1028";
            }

            container.appendChild(item);
            fallingItems.push({ element: item, x: itemX, y: 0 });
            fallSpeed = 3 + Math.floor(score / 50);
        }

        // 遊戲核心循環
        function updateGame() {
            if (isGameOver) return;

            for (let i = fallingItems.length - 1; i >= 0; i--) {
                let item = fallingItems[i];
                item.y += fallSpeed;
                item.element.style.top = item.y + 'px';

                // 碰撞檢測 (接物偵測)
                if (item.y >= 380 && item.y <= 410) {
                    if (item.x + 40 >= playerX && item.x <= playerX + playerWidth) {
                        score += 10;
                        scoreBoard.textContent = "得分: " + score;
                        item.element.remove();
                        fallingItems.splice(i, 1);
                        continue;
                    }
                }

                // 漏接偵測
                if (item.y > 460) {
                    lives--;
                    let hearts = "";
                    for(let j=0; j<3; j++) hearts += j < lives ? "❤️" : "🖤";
                    livesBoard.textContent = "生命值: " + hearts;
                    
                    item.element.remove();
                    fallingItems.splice(i, 1);

                    if (lives <= 0) {
                        isGameOver = true;
                        cancelAnimationFrame(gameLoopId);
                        clearInterval(spawnTimerId);
                        finalScoreText.textContent = "最終得分: " + score;
                        gameOverScreen.style.display = 'flex';
                        break;
                    }
                }
            }
            if (!isGameOver) gameLoopId = requestAnimationFrame(updateGame);
        }

        function resetGame() {
            fallingItems.forEach(item => item.element.remove());
            fallingItems = [];
            score = 0;
            lives = 3;
            fallSpeed = 3;
            isGameOver = false;
            scoreBoard.textContent = "得分: 0";
            livesBoard.textContent = "生命值: ❤️❤️❤️";
