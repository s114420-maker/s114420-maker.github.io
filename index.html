<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4096 經典滑塊遊戲 - 自訂背景版</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #faf8ef;
            font-family: "Clear Sans", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            color: #776e65;
            font-size: 36px;
            margin: 10px 0 5px 0;
        }

        .score-container {
            background: #bbada0;
            padding: 10px 25px;
            font-size: 22px;
            font-weight: bold;
            color: white;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        /* 背景圖片上傳控制區 */
        .upload-panel {
            background: #bbada0;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        .upload-panel input {
            margin-top: 5px;
            font-size: 12px;
        }

        /* 4x4 遊戲大容器 */
        .game-container {
            position: relative;
            width: 340px;
            height: 340px;
            background: #bbada0;
            border-radius: 10px;
            padding: 10px;
            box-sizing: border-box;
            touch-action: none; /* 防止手機上下捲動 */
            background-size: cover;
            background-position: center;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            height: 100%;
        }

        /* 半透明背景格，這樣能隱約透出你自訂的背景圖 */
        .grid-cell {
            background: rgba(238, 228, 218, 0.4);
            border-radius: 5px;
        }

        .tile-container {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            pointer-events: none;
        }

        /* 數字方塊基本樣式 */
        .tile {
            position: absolute;
            width: 72px;
            height: 72px;
            border-radius: 5px;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #776e65;
            background: #eee4da;
            transition: top 0.1s ease-in-out, left 0.1s ease-in-out;
            box-sizing: border-box;
        }

        /* 各數字預設配色（微調半透明，讓整體視覺更好看） */
        .tile-2 { background: rgba(238, 228, 218, 0.9); }
        .tile-4 { background: rgba(237, 224, 200, 0.9); }
        .tile-8 { background: rgba(242, 177, 121, 0.95); color: #f9f6f2; }
        .tile-16 { background: rgba(245, 149, 99, 0.95); color: #f9f6f2; }
        .tile-32 { background: rgba(246, 124, 95, 0.95); color: #f9f6f2; }
        .tile-64 { background: rgba(246, 94, 59, 0.95); color: #f9f6f2; }
        .tile-128 { background: rgba(237, 207, 114, 0.95); color: #f9f6f2; font-size: 24px; }
        .tile-256 { background: rgba(237, 204, 97, 0.95); color: #f9f6f2; font-size: 24px; }
        .tile-512 { background: rgba(237, 200, 80, 0.95); color: #f9f6f2; font-size: 24px; }
        .tile-1024 { background: rgba(237, 197, 63, 0.95); color: #f9f6f2; font-size: 20px; }
        .tile-2048 { background: rgba(237, 194, 46, 0.95); color: #f9f6f2; font-size: 20px; }
        .tile-4096 { background: rgba(60, 58, 50, 0.95); color: #f9f6f2; font-size: 20px; }

        /* 遊戲結束蓋板 */
        .game-message {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(238, 228, 218, 0.8);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            z-index: 10;
        }

        .game-message p {
            font-size: 36px;
            font-weight: bold;
            color: #776e65;
            margin-bottom: 20px;
        }

        .retry-button {
            background: #8f7a66;
            color: #f9f6f2;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h1>4096 經典益智</h1>
    
    <div class="score-container">SCORE: <span id="score">0</span></div>

    <!-- 自訂背景圖片區 -->
    <div class="upload-panel">
        <label for="bg-upload">🖼️ 更換遊戲大框框的背景圖片</label><br>
        <input type="file" id="bg-upload" accept="image/*">
    </div>

    <!-- 遊戲主區塊 -->
    <div class="game-container" id="game-container">
        <div class="grid-container">
            <!-- 4x4 背景網格 -->
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        </div>

        <div class="tile-container" id="tile-container"></div>

        <div class="game-message" id="game-message">
            <p id="game-over-text">遊戲結束</p>
            <button class="retry-button" onclick="setupGame()">重新開始</button>
        </div>
    </div>

    <script>
        const gameContainer = document.getElementById('game-container');
        const tileContainer = document.getElementById('tile-container');
        const scoreDisplay = document.getElementById('score');
        const gameMessage = document.getElementById('game-message');
        const gameOverText = document.getElementById('game-over-text');
        const bgUpload = document.getElementById('bg-upload');

        let board = Array(4).fill(null).map(() => Array(4).fill(0));
        let score = 0;
        const size = 4;
        const tileSize = 72;
        const gap = 10;

        // 監聽背景圖片上傳
        bgUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    gameContainer.style.backgroundImage = `url('${event.target.result}')`;
                };
                reader.readAsDataURL(file);
            }
        });

        // 遊戲初始化
        function setupGame() {
            board = Array(4).fill(null).map(() => Array(4).fill(0));
            score = 0;
            scoreDisplay.textContent = score;
            gameMessage.style.display = 'none';
            addRandomTile();
            addRandomTile();
            drawBoard();
        }

        // 隨機在空位產生 2 或 4
        function addRandomTile() {
            let emptyCells = [];
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (board[r][c] === 0) emptyCells.push({ r, c });
                }
            }
            if (emptyCells.length > 0) {
                let { r, c } = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                board[r][c] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        // 畫出目前的數字方塊
        function drawBoard() {
            tileContainer.innerHTML = '';
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    let value = board[r][c];
                    if (value > 0) {
                        let tile = document.createElement('div');
                        tile.classList.add('tile', `tile-${value}`);
                        tile.style.top = (r * (tileSize + gap)) + 'px';
                        tile.style.left = (c * (tileSize + gap)) + 'px';
                        tile.textContent = value;
                        tileContainer.appendChild(tile);
                    }
                }
            }
        }

        // 核心計算：滑動並合併一列
        function slide(row) {
            let arr = row.filter(val => val);
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] === arr[i + 1]) {
                    arr[i] *= 2;
                    score += arr[i];
                    arr[i + 1] = 0;
                }
            }
            arr = arr.filter(val => val);
            while (arr.length < size) arr.push(0);
            return arr;
        }

        // 處理四個方向的移動
        function move(direction) {
            let oldBoard = JSON.stringify(board);

            if (direction === 'left') {
                for (let r = 0; r < size; r++) board[r] = slide(board[r]);
            } else if (direction === 'right') {
                for (let r = 0; r < size; r++) {
                    board[r].reverse();
                    board[r] = slide(board[r]);
                    board[r].reverse();
                }
            } else if (direction === 'up') {
                for (let c = 0; c < size; c++) {
                    let row = [board[0][c], board[1][c], board[2][c], board[3][c]];
                    row = slide(row);
                    for (let r = 0; r < size; r++) board[r][c] = row[r];
                }
            } else if (direction === 'down') {
                for (let c = 0; c < size; c++) {
                    let row = [board[0][c], board[1][c], board[2][c], board[3][c]].reverse();
                    row = slide(row);
                    row.reverse();
