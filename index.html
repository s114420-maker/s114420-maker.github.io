<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4096 自訂圖片版經典遊戲</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #faf8ef;
            font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            color: #776e65;
            font-size: 40px;
            margin: 10px 0 5px 0;
        }

        /* 圖片自訂面板 */
        .upload-container {
            background: #bbada0;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            max-width: 360px;
        }

        .upload-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #eee4da;
            padding: 5px;
            border-radius: 5px;
            font-size: 11px;
            color: #776e65;
            font-weight: bold;
        }

        .upload-item input {
            width: 70px;
            font-size: 9px;
            margin-top: 3px;
        }

        /* 分數面板 */
        .score-container {
            background: #bbada0;
            padding: 10px 25px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        /* 4x4 遊戲棋盤 */
        .game-container {
            position: relative;
            width: 340px;
            height: 340px;
            background: #bbada0;
            border-radius: 10px;
            padding: 10px;
            box-sizing: border-box;
            touch-action: none; /* 防止手機滑動時網頁上下震動 */
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            height: 100%;
        }

        .grid-cell {
            background: rgba(238, 228, 218, 0.35);
            border-radius: 5px;
        }

        /* 數字/圖片方塊容器 */
        .tile-container {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            pointer-events: none;
        }

        .tile {
            position: absolute;
            width: 72px;
            height: 72px;
            border-radius: 5px;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #776e65;
            background: #eee4da;
            transition: transform 0.1s ease-in-out, top 0.1s ease-in-out, left 0.1s ease-in-out;
            background-size: cover;
            background-position: center;
            box-sizing: border-box;
        }

        /* 各數字預設顏色 (若不換圖會套用此配色) */
        .tile-2 { background: #eee4da; }
        .tile-4 { background: #ede0c8; }
        .tile-8 { background: #f2b179; color: #f9f6f2; }
        .tile-16 { background: #f59563; color: #f9f6f2; }
        .tile-32 { background: #f67c5f; color: #f9f6f2; }
        .tile-64 { background: #f65e3b; color: #f9f6f2; }
        .tile-128 { background: #edcf72; color: #f9f6f2; font-size: 24px; }
        .tile-256 { background: #edcc61; color: #f9f6f2; font-size: 24px; }
        .tile-512 { background: #edc850; color: #f9f6f2; font-size: 24px; }
        .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 20px; }
        .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 20px; }
        .tile-4096 { background: #3c3a32; color: #f9f6f2; font-size: 20px; }

        /* 遮罩蓋板 (遊戲結束) */
        .game-message {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(238, 228, 218, 0.73);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            z-index: 10;
        }

        .game-message p {
            font-size: 40px;
            font-weight: bold;
            color: #776e65;
            margin-bottom: 20px;
        }

        .retry-button {
            background: #8f7a66;
            color: #f9f6f2;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h1>4096 經典滑塊</h1>
    
    <div class="score-container">SCORE: <span id="score">0</span></div>

    <!-- 自訂圖片區 (挑選最主要的四個層級提供更換) -->
    <div class="upload-container">
        <div class="upload-item"><label>方塊 2 圖</label><input type="file" data-tile="2" accept="image/*"></div>
        <div class="upload-item"><label>方塊 4 圖</label><input type="file" data-tile="4" accept="image/*"></div>
        <div class="upload-item"><label>方塊 8 圖</label><input type="file" data-tile="8" accept="image/*"></div>
        <div class="upload-item"><label>方塊 16 圖</label><input type="file" data-tile="16" accept="image/*"></div>
    </div>

    <div class="game-container">
        <div class="grid-container">
            <!-- 4x4 背景網格 -->
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        </div>

        <!-- 實際移動的數字/圖片方塊 -->
        <div class="tile-container" id="tile-container"></div>

        <!-- 結束或獲勝畫面 -->
        <div class="game-message" id="game-message">
            <p id="game-over-text">遊戲結束</p>
            <button class="retry-button" onclick="setupGame()">重新開始</button>
        </div>
    </div>

    <script>
        const tileContainer = document.getElementById('tile-container');
        const scoreDisplay = document.getElementById('score');
        const gameMessage = document.getElementById('game-message');
        const gameOverText = document.getElementById('game-over-text');

        let board = Array(4).fill(null).map(() => Array(4).fill(0));
        let score = 0;
        const size = 4;
        const tileSize = 72;
        const gap = 10;

        // 儲存用戶自訂圖片
        let customTileImages = { 2: '', 4: '', 8: '', 16: '' };

        // 監聽圖片上傳變更
        document.querySelectorAll('.upload-item input').forEach(input => {
            input.addEventListener('change', function(e) {
                const num = this.dataset.tile;
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        customTileImages[num] = event.target.result;
                        drawBoard(); // 立即重新渲染棋盤
                    };
                    reader.readAsDataURL(file);
                }
            });
        });

        function setupGame() {
            board = Array(4).fill(null).map(() => Array(4).fill(0));
            score = 0;
            scoreDisplay.textContent = score;
            gameMessage.style.display = 'none';
            addRandomTile();
            addRandomTile();
            drawBoard();
        }

        function addRandomTile() {
            let emptyCells = [];
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (board[r][c] === 0) emptyCells.push({ r, c });
                }
            }
            if (emptyCells.length > 0) {
                let { r, c } = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                board[r][c] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        // 繪製棋盤與渲染圖片
        function drawBoard() {
            tileContainer.innerHTML = '';
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    let value = board[r][c];
                    if (value > 0) {
                        let tile = document.createElement('div');
                        tile.classList.add('tile', `tile-${value}`);
                        
                        // 計算正確的 CSS 絕對定位位置
                        tile.style.top = (r * (tileSize + gap)) + 'px';
                        tile.style.left = (c * (tileSize + gap)) + 'px';

                        // 判斷是否套用自訂圖片，如果上傳了圖片就不顯示數字
                        if (customTileImages[value]) {
                            tile.style.backgroundImage = `url('${customTileImages[value]}')`;
                            tile.style.color = 'transparent'; 
                        } else {
                            tile.textContent = value;
                        }

                        tileContainer.appendChild(tile);
                    }
                }
            }
        }

        // 核心移動邏輯
        function slide(row) {
            let arr = row.filter(val => val);
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] === arr[i + 1]) {
                    arr[i] *= 2;
                    score += arr[i];
                    arr[i + 1] = 0;
                }
            }
            arr = arr.filter(val => val);
            while (arr.length < size) arr.push(0);
            return arr;
        }

        function move(direction) {
            let moved = false;
