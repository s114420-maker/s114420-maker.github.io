<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>撲克牌記憶配對遊戲</title>
    <style>
        :root {
            --bg-color: #2c3e50;
            --card-back: #e74c3c;
            --card-front: #ffffff;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        /* 儀表板資訊 */
        .info-panel {
            display: flex;
            gap: 20px;
            font-size: 1.2rem;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 20px;
            border-radius: 8px;
        }

        /* 遊戲主舞台 */
        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 600px;
            width: 100%;
        }

        /* 卡牌基礎樣式 */
        .card {
            aspect-ratio: 2 / 3;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }

        /* 翻牌動態效能 */
        .card.flipped {
            transform: rotateY(180deg);
        }

        .card.matched {
            transform: rotateY(180deg);
            opacity: 0.6;
            cursor: default;
            pointer-events: none;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        /* 卡背 */
        .card-back {
            background-color: var(--card-back);
            border: 5px solid white;
            box-sizing: border-box;
            background-image: radial-gradient(rgba(255,255,255,0.3) 15%, transparent 16%),
                              radial-gradient(rgba(255,255,255,0.3) 15%, transparent 16%);
            background-size: 16px 16px;
            background-position: 0 0, 8px 8px;
        }

        /* 卡面 */
        .card-front {
            background-color: var(--card-front);
            transform: rotateY(180deg);
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            box-sizing: border-box;
        }

        /* 花色顏色調整 */
        .card-front.red { color: #e74c3c; }
        .card-front.black { color: #2c3e50; }

        .card-corner {
            align-self: flex-start;
            font-size: 1.2rem;
            line-height: 1;
        }
        .card-center {
            font-size: 3rem;
            line-height: 1;
        }
        .card-corner.bottom {
            align-self: flex-end;
            transform: rotate(180deg);
        }

        /* 按鈕樣式 */
        .btn {
            margin-top: 20px;
            padding: 10px 25px;
            font-size: 1.1rem;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #27ae60; }

        /* RWD 調整 */
        @media (max-width: 480px) {
            .game-board { gap: 8px; }
            .card-face { font-size: 1.5rem; }
            .card-center { font-size: 2rem; }
            .card-corner { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <h1>撲克牌記憶配對</h1>
    
    <div class="info-panel">
        <div>時間: <span id="timer">0</span> 秒</div>
        <div>翻牌次數: <span id="moves">0</span></div>
    </div>

    <div class="game-board" id="board"></div>

    <button class="btn" onclick="resetGame()">重新開始</button>

    <script>
        // 定義遊戲所需的 8 對撲克牌（共 16 張）
        const cardData = [
            { suit: '♠', value: 'A', color: 'black' },
            { suit: '♥', value: 'K', color: 'red' },
            { suit: '♦', value: 'Q', color: 'red' },
            { suit: '♣', value: 'J', color: 'black' },
            { suit: '♠', value: '10', color: 'black' },
            { suit: '♥', value: '9', color: 'red' },
            { suit: '♦', value: '8', color: 'red' },
            { suit: '♣', value: '7', color: 'black' }
        ];

        // 複製成雙份
        let cards = [...cardData, ...cardData];
        
        let flippedCards = [];
        let matchedCount = 0;
        let moves = 0;
        let timer = null;
        let seconds = 0;
        let gameStarted = false;

        const board = document.getElementById('board');
        const timerEl = document.getElementById('timer');
        const movesEl = document.getElementById('moves');

        // 洗牌演算法 (Fisher-Yates)
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 初始化遊戲板
        function initGame() {
            board.innerHTML = '';
            flippedCards = [];
            matchedCount = 0;
            moves = 0;
            seconds = 0;
            gameStarted = false;
            clearInterval(timer);
            timerEl.textContent = seconds;
            movesEl.textContent = moves;

            const shuffledCards = shuffle([...cards]);

            shuffledCards.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.classList.add('card');
                cardEl.dataset.index = index;
                cardEl.dataset.suit = card.suit;
                cardEl.dataset.value = card.value;

                cardEl.innerHTML = `
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front ${card.color}">
                        <div class="card-corner">${card.value}<br>${card.suit}</div>
                        <div class="card-center">${card.suit}</div>
                        <div class="card-corner bottom">${card.value}<br>${card.suit}</div>
                    </div>
                `;

                cardEl.addEventListener('click', flipCard);
                board.appendChild(cardEl);
            });
        }

        // 計時器功能
        function startTimer() {
            gameStarted = true;
            timer = setInterval(() => {
                seconds++;
                timerEl.textContent = seconds;
            }, 1000);
        }

        // 翻牌邏輯
        function flipCard() {
            if (!gameStarted) startTimer();
            
            // 防止重複點擊已翻開、已配對的牌，或同時點擊超過兩張牌
            if (this.classList.contains('flipped') || this.classList.contains('matched') || flippedCards.length >= 2) {
                return;
            }

            this.classList.add('flipped');
            flippedCards.push(this);

            if (flippedCards.length === 2) {
                moves++;
                movesEl.textContent = moves;
                checkMatch();
            }
        }

        // 檢查是否配對成功
        function checkMatch() {
            const [card1, card2] = flippedCards;
            const isMatch = card1.dataset.suit === card2.dataset.suit && card1.dataset.value === card2.dataset.value;

            if (isMatch) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                matchedCount += 2;
                flippedCards = [];

                // 檢查是否全破
                if (matchedCount === cards.length) {
                    clearInterval(timer);
                    setTimeout(() => {
                        alert(`恭喜通關！🎉\n總共花費了 ${seconds} 秒，翻牌次數：${moves} 次！`);
                    }, 500);
                }
            } else {
                // 配對失敗，0.8秒後翻回去
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                }, 800);
            }
        }

        function resetGame() {
            initGame();
        }

        // 網頁載入時啟動
        initGame();
    </script>
</body>
</html>
