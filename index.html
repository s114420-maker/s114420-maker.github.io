<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>向日葵小花園 ｜ 盲盒隨機記憶對決</title>

    <style>
        :root {
            /* 專屬溫馨淡黃色繪本風格 */
            --bg-color: #fcf8ee;       /* 溫暖淡黃色背景 */
            --panel-bg: #ffffff;       /* 白色純淨看板 */
            --accent-color: #e2a04e;    /* 向日葵深黃 */
            --card-front-bg: #ffffff;  /* 卡片正面白色 */
            --border-normal: #f0cb85;  /* 卡片未配對時的淡黃邊框 */
            --border-matched: #52b788; /* 配對成功時的草綠色邊框 */
            --text-dark: #4a3e3d;      /* 繪本風深色文字 */
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            background-image: radial-gradient(rgba(226, 160, 78, 0.12) 15%, transparent 16%);
            background-size: 24px 24px;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            margin-bottom: 5px;
            font-size: 2.2rem;
            color: var(--accent-color);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
            letter-spacing: 1px;
        }

        /* 數據看板 */
        .info-panel {
            display: flex;
            gap: 40px;
            font-size: 1.2rem;
            margin-bottom: 25px;
            background: var(--panel-bg);
            padding: 10px 30px;
            border-radius: 50px;
            border: 2px solid var(--border-normal);
            box-shadow: 0 4px 12px rgba(226, 160, 78, 0.1);
        }

        .info-panel div {
            color: var(--text-dark);
            font-weight: 500;
        }

        .info-panel span {
            color: var(--accent-color);
            font-weight: bold;
        }

        /* 4x4 遊戲網格 */
        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            max-width: 520px;
            width: 100%;
        }

        /* 卡牌立體翻轉 */
        .card {
            aspect-ratio: 1 / 1;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .card.flipped, .card.matched {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 14px;
            box-shadow: 0 4px 10px rgba(74, 62, 61, 0.12);
            box-sizing: border-box;
        }

        /* 卡背：固定完整縮放呈現整張插畫 */
        .card-back {
            border: 3.5px solid #ffffff;
            transition: all 0.3s ease;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #fff2da;
        }
        .card:hover .card-back {
            border-color: var(--accent-color);
            transform: scale(1.03);
        }

        /* 卡面：撲克牌花色樣式 */
        .card-front {
            background-color: var(--card-front-bg);
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            border: 3.5px solid var(--border-normal);
        }

        /* 配對成功鎖定特效：溫和的草綠色光暈 */
        .card.matched .card-front {
            border-color: var(--border-matched);
            box-shadow: 0 0 15px rgba(82, 183, 136, 0.5);
            animation: matchPulse 1.5s infinite alternate;
        }

        /* 花色顏色調整 */
        .card-front.red { color: #de5d68; }
        .card-front.black { color: #3d5a80; }

        .card-corner {
            align-self: flex-start;
            font-size: 1.2rem;
            font-weight: 900;
            line-height: 1;
        }
        .card-center {
            font-size: 2.8rem;
            align-self: center;
            line-height: 1;
        }
        .card-corner.bottom {
            align-self: flex-end;
            transform: rotate(180deg);
        }

        /* 按鈕樣式 */
        .btn {
            margin-top: 30px;
            padding: 12px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            background: linear-gradient(45deg, #f7d08a, var(--accent-color));
            color: #ffffff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(226, 160, 78, 0.2);
            transition: all 0.3s ease;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(226, 160, 78, 0.3);
        }

        @keyframes matchPulse {
            0% { box-shadow: 0 0 5px rgba(82, 183, 136, 0.3); }
            100% { box-shadow: 0 0 15px rgba(82, 183, 136, 0.6); }
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.6rem; }
            .info-panel { gap: 20px; font-size: 1rem; padding: 8px 20px; }
            .game-board { gap: 8px; }
            .card-center { font-size: 2rem; }
            .card-corner { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <h1>🌻 向日葵日常 ﹒ 隨機盲盒配對</h1>
    
    <div class="info-panel">
        <div>時間: <span id="timer">0</span> 秒</div>
        <div>翻牌次數: <span id="moves">0</span></div>
    </div>

    <div class="game-board" id="board"></div>

    <button class="btn" onclick="resetGame()">重新隨機洗牌</button>

    <script>
        // 定義 8 組正面花色
        const baseCards = [
            { suit: '♠', value: 'A', color: 'black' },
            { suit: '♥', value: 'K', color: 'red' },
            { suit: '♦', value: 'Q', color: 'red' },
            { suit: '♣', value: 'J', color: 'black' },
            { suit: '♠', value: '10', color: 'black' },
            { suit: '♥', value: '9', color: 'red' },
            { suit: '♦', value: '8', color: 'red' },
            { suit: '♣', value: '7', color: 'black' }
        ];

        // 依然使用剛才的 6 張插畫檔名作為卡背來源
        const backImages = [
            'image1.jpg',
            'image2.jpg',
            'image3.jpg',
            'image4.jpg',
            'image5.jpg',
            'image6.jpg'
        ];

        let cards = [];
        let flippedCards = [];
        let matchedCount = 0;
        let moves = 0;
        let timer = null;
        let seconds = 0;
        let gameStarted = false;

        const board = document.getElementById('board');
        const timerEl = document.getElementById('timer');
        const movesEl = document.getElementById('moves');

        // 洗牌演算法 (Fisher-Yates)
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 核心機制：動態生成 16 張卡，並從 6 張圖中隨機抽樣指派給卡背，永不報錯
        function generateDeck() {
            let deck = [];
            const tempFronts = [...baseCards, ...baseCards];
            
            // 建立一個 16 個位置的隨機卡背陣列
            let assignedBacks = [];
            for (let i = 0; i < 16; i++) {
                // 每次循環都從 6 張原圖中，隨機抽出一張
                const randomImg = backImages[Math.floor(Math.random() * backImages.length)];
                assignedBacks.push(randomImg);
            }

            tempFronts.forEach((front, index) => {
                deck.push({
                    ...front,
                    bgImage: assignedBacks[index]
                });
            });
            return deck;
        }

        function initGame() {
            board.innerHTML = '';
            flippedCards = [];
            matchedCount = 0;
            moves = 0;
            seconds = 0;
            gameStarted = false;
            clearInterval(timer);
            timerEl.textContent = seconds;
            movesEl.textContent = moves;

            // 雙重大洗牌：先隨機抽取配對卡背，再大洗牌打亂網格順序
            cards = shuffle(generateDeck());

            cards.forEach((card) => {
                const cardEl = document.createElement('div');
                cardEl.classList.add('card');
                cardEl.dataset.suit = card.suit;
                cardEl.dataset.value = card.value;

                cardEl.innerHTML = `
                    <div class="card-face card-back" style="background-image: url('${card.bgImage}');"></div>
                    <div class="card-face card-front ${card.color}">
                        <div class="card-corner">${card.value}<br>${card.suit}</div>
                        <div class="card-center">${card.suit}</div>
                        <div class="card-corner bottom">${card.value}<br>${card.suit}</div>
                    </div>
                `;

                cardEl.addEventListener('click', flipCard);
                board.appendChild(cardEl);
            });
        }

        function startTimer() {
            gameStarted = true;
            timer = setInterval(() => {
                seconds++;
                timerEl.textContent = seconds;
            }, 1000);
        }

        function flipCard() {
            if (!gameStarted) startTimer();
            if (this.classList.contains('flipped') || this.classList.contains('matched') || flippedCards.length >= 2) {
                return;
            }

            this.classList.add('flipped');
            flippedCards.push(this);

            if (flippedCards.length === 2) {
                moves++;
                movesEl.textContent = moves;
                checkMatch();
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
