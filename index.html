<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>向日葵日常 ｜ 盲盒隨機翻牌配對遊戲</title>

    <style>
        :root {
            /* 配合 817 派對與溫馨插畫調整的繽紛文青配色 */
            --bg-color: #1a2536;
            --panel-bg: rgba(255, 255, 255, 0.08);
            --accent-color: #ffd166;
            --card-front-bg: #ffffff;
            --border-normal: #f4a261;
            --border-matched: #06d6a0;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            background-image: radial-gradient(rgba(255, 209, 102, 0.06) 15%, transparent 16%);
            background-size: 30px 30px;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            margin-bottom: 5px;
            font-size: 2.2rem;
            color: var(--accent-color);
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }

        /* 數據看板 */
        .info-panel {
            display: flex;
            gap: 40px;
            font-size: 1.2rem;
            margin-bottom: 25px;
            background: var(--panel-bg);
            padding: 10px 30px;
            border-radius: 50px;
            border: 2px solid var(--accent-color);
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .info-panel span {
            color: var(--accent-color);
            font-weight: bold;
        }

        /* 4x4 遊戲網格 */
        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            max-width: 520px;
            width: 100%;
        }

        /* 卡牌基礎與立體翻轉 */
        .card {
            aspect-ratio: 1 / 1;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .card.flipped, .card.matched {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 14px;
            box-shadow: 0 5px 12px rgba(0,0,0,0.4);
            box-sizing: border-box;
        }

        /* 卡背 */
        .card-back {
            border: 3.5px solid #ffffff;
            transition: all 0.3s ease;
            background-color: #2b3a4a;
        }
        .card:hover .card-back {
            border-color: var(--accent-color);
            transform: scale(1.03);
        }

        /* 卡面：撲克牌花色樣式 */
        .card-front {
            background-color: var(--card-front-bg);
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            border: 3.5px solid var(--border-normal);
        }

        /* 配對成功鎖定特效 */
        .card.matched .card-front {
            border-color: var(--border-matched);
            box-shadow: 0 0 18px rgba(6, 214, 160, 0.7);
            animation: matchPulse 1.5s infinite alternate;
        }

        /* 花色顏色調整 */
        .card-front.red { color: #ef476f; }
        .card-front.black { color: #118ab2; }

        .card-corner {
            align-self: flex-start;
            font-size: 1.2rem;
            font-weight: 900;
            line-height: 1;
        }
        .card-center {
            font-size: 2.8rem;
            align-self: center;
            line-height: 1;
        }
        .card-corner.bottom {
            align-self: flex-end;
            transform: rotate(180deg);
        }

        /* 按鈕樣式 */
        .btn {
            margin-top: 30px;
            padding: 12px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            background: linear-gradient(45deg, #f4a261, var(--accent-color));
            color: #1a2536;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 209, 102, 0.4);
        }

        @keyframes matchPulse {
            0% { box-shadow: 0 0 8px rgba(6, 214, 160, 0.4); }
            100% { box-shadow: 0 0 22px rgba(6, 214, 160, 0.8); }
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.6rem; }
            .info-panel { gap: 20px; font-size: 1rem; padding: 8px 20px; }
            .game-board { gap: 8px; }
            .card-center { font-size: 2rem; }
            .card-corner { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <h1>向日葵特輯 ﹒ 隨機盲盒配對</h1>
    
    <div class="info-panel">
        <div>時間: <span id="timer">0</span> 秒</div>
        <div>翻牌次數: <span id="moves">0</span></div>
    </div>

    <div class="game-board" id="board"></div>

    <button class="btn" onclick="resetGame()">重新隨機洗牌</button>

    <script>
        // 定義 8 組正面花色
        const baseCards = [
            { suit: '♠', value: 'A', color: 'black' },
            { suit: '♥', value: 'K', color: 'red' },
            { suit: '♦', value: 'Q', color: 'red' },
            { suit: '♣', value: 'J', color: 'black' },
            { suit: '♠', value: '10', color: 'black' },
            { suit: '♥', value: '9', color: 'red' },
            { suit: '♦', value: '8', color: 'red' },
            { suit: '♣', value: '7', color: 'black' }
        ];

        // 16 種精緻的卡背樣式組合
        const cardBackPool = [
            { img: 'image1.jpg', size: 'cover', pos: 'center' },
            { img: 'image1.jpg', size: '180%', pos: '48% 85%' },
            { img: 'image2.jpg', size: 'cover', pos: 'center' },
            { img: 'image2.jpg', size: '180%', pos: '80% 68%' },
            { img: 'image3.jpg', size: 'cover', pos: 'center' },
            { img: 'image3.jpg', size: '180%', pos: '50% 80%' },
            { img: 'image4.jpg', size: 'cover', pos: 'center' },
            { img: 'image4.jpg', size: '180%', pos: '85% 42%' },
            { img: 'image5.jpg', size: 'cover', pos: 'center' },
            { img: 'image5.jpg', size: '170%', pos: '80% 25%' },
            { img: 'image5.jpg', size: '170%', pos: '48% 68%' },
            { img: 'image6.jpg', size: 'cover', pos: 'center' },
            { img: 'image6.jpg', size: '160%', pos: '50% 10%' },
            { img: 'image6.jpg', size: '170%', pos: '78% 62%' },
            { img: 'image6.jpg', size: '170%', pos: '48% 62%' }
        ];

        let cards = [];
        let flippedCards = [];
        let matchedCount = 0;
        let moves = 0;
        let timer = null;
        let seconds = 0;
        let gameStarted = false;

        const board = document.getElementById('board');
        const timerEl = document.getElementById('timer');
        const movesEl = document.getElementById('moves');

        // 洗牌演算法 (Fisher-Yates)
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function generateDeck() {
            let deck = [];
            // 複製出 16 張正面花色的牌組
            const tempFronts = [...baseCards, ...baseCards];
            
            // 【核心修改】：每次洗牌時，也將卡背池隨機打亂！
            const shuffledBacks = shuffle([...cardBackPool]);

            tempFronts.forEach((front, index) => {
                // 如果卡背池數量少於 16，則安全取餘數（此處卡背池有 15 種，會有一種被複用，完美運作）
                const backConfig = shuffledBacks[index % shuffledBacks.length];
                deck.push({
                    ...front,
                    bgImage: backConfig.img,
                    bgSize: backConfig.size,
                    bgPos: backConfig.pos
                });
            });
            return deck;
        }

        function initGame() {
            board.innerHTML = '';
            flippedCards = [];
            matchedCount = 0;
            moves = 0;
            seconds = 0;
            gameStarted = false;
            clearInterval(timer);
            timerEl.textContent = seconds;
            movesEl.textContent = moves;

            // 1. 生成卡背與正面花色隨機配對的牌組
            // 2. 再將整組牌全面大洗牌，決定畫面的排列順序
            cards = shuffle(generateDeck());

            cards.forEach((card) => {
                const cardEl = document.createElement('div');
                cardEl.classList.add('card');
                cardEl.dataset.suit = card.suit;
                cardEl.dataset.value = card.value;

                cardEl.innerHTML = `
                    <div class="card-face card-back" style="background-image: url('${card.bgImage}'); background-size: ${card.bgSize}; background-position: ${card.bgPos};"></div>
                    <div class="card-face card-front ${card.color}">
                        <div class="card-corner">${card.value}<br>${card.suit}</div>
                        <div class="card-center">${card.suit}</div>
                        <div class="card-corner bottom">${card.value}<br>${card.suit}</div>
                    </div>
                `;

                cardEl.addEventListener('click', flipCard);
                board.appendChild(cardEl);
            });
        }

        function startTimer() {
            gameStarted = true;
            timer = setInterval(() => {
                seconds++;
                timerEl.textContent = seconds;
            }, 1000);
        }

        function flipCard() {
            if (!gameStarted) startTimer();
